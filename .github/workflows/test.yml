# push と pull request のたびに、自動テストと型チェックを動かす。
# NAVITIME は呼ばない（テストは応答を差し替えて動かし、API キーは使わない）
name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
